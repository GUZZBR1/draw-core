<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Lápis escolar amarelo</title>
  <desc id="desc">Lápis amarelo clássico, apontado, com ponteira metálica e borracha rosa.</desc>
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe456"/>
      <stop offset=".45" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#e9a900"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d29a"/>
      <stop offset="1" stop-color="#c8904c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#858b90"/>
      <stop offset=".2" stop-color="#f4f4ef"/>
      <stop offset=".48" stop-color="#aeb3b5"/>
      <stop offset=".72" stop-color="#faf9f1"/>
      <stop offset="1" stop-color="#777d81"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb0a5"/>
      <stop offset="1" stop-color="#e66f70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <!-- soft grounding shadow -->
  <ellipse cx="602" cy="305" rx="465" ry="24" fill="#70552b" opacity=".16" filter="url(#shadow)"/>
  <!-- pencil body, shown at a slight upward angle -->
  <g transform="rotate(-9 600 205)">
    <!-- sharpened wooden nose -->
    <path d="M112 205 L222 145 L222 265 Z" fill="url(#wood)" stroke="#a9783e" stroke-width="3"/>
    <path d="M112 205 L222 145 L190 205 Z" fill="#f8dfb4" opacity=".72"/>
    <path d="M112 205 L222 265 L190 205 Z" fill="#b98042" opacity=".35"/>
    <!-- graphite -->
    <path d="M112 205 L82 205 L112 198 Z" fill="#282a2d"/>
    <path d="M82 205 L112 205 L112 198 Z" fill="#111315"/>
    <!-- hexagonal yellow shaft -->
    <path d="M222 145 L1000 145 L1018 161 L1018 249 L1000 265 L222 265 Z" fill="url(#yellow)" stroke="#d59a00" stroke-width="3"/>
    <path d="M222 145 L1000 145 L1018 161 L222 161 Z" fill="#fff178" opacity=".58"/>
    <path d="M222 249 L1018 249 L1000 265 L222 265 Z" fill="#d99400" opacity=".5"/>
    <path d="M245 173 L977 173" stroke="#fff8b3" stroke-width="5" opacity=".45"/>
    <!-- ferrule -->
    <path d="M1000 145 L1060 145 L1070 161 L1070 249 L1060 265 L1000 265 L1018 249 L1018 161 Z" fill="url(#metal)" stroke="#777d80" stroke-width="3"/>
    <path d="M1025 148 L1025 262 M1034 148 L1034 262 M1051 148 L1051 262" stroke="#777d80" stroke-width="4" opacity=".8"/>
    <path d="M1018 169 L1065 169 M1018 241 L1065 241" stroke="#f9f8f1" stroke-width="4" opacity=".85"/>
    <!-- pink eraser -->
    <path d="M1070 145 L1126 145 Q1152 145 1152 171 L1152 239 Q1152 265 1126 265 L1070 265 Z" fill="url(#pink)" stroke="#ce686b" stroke-width="3"/>
    <path d="M1082 154 L1122 154 Q1138 154 1142 168" fill="none" stroke="#ffd0c5" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
