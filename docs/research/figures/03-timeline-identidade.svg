<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d"><title id="t">Linha do tempo de identidade</title><desc id="d">Eventos externos de permanência, deslocamento, ausência e retorno de páginas.</desc><rect width="1200" height="370" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Eventos observáveis ao longo da sessão</text><line x1="70" y1="185" x2="1130" y2="185" stroke="#25333A" stroke-width="2"/><circle cx="70.0" cy="185" r="7" fill="#3E6F78"/><text x="70.0" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#25333A" text-anchor="middle">página visível</text><circle cx="282.0" cy="185" r="7" fill="#3E6F78"/><text x="282.0" y="219" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#25333A" text-anchor="middle">desloca</text><circle cx="494.0" cy="185" r="7" fill="#3E6F78"/><text x="494.0" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#25333A" text-anchor="middle">ausente</text><circle cx="706.0" cy="185" r="7" fill="#3E6F78"/><text x="706.0" y="219" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#25333A" text-anchor="middle">página parecida</text><circle cx="918.0" cy="185" r="7" fill="#3E6F78"/><text x="918.0" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#25333A" text-anchor="middle">retorno</text><circle cx="1130.0" cy="185" r="7" fill="#3E6F78"/><text x="1130.0" y="219" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#25333A" text-anchor="middle">fim da sessão</text><text x="600" y="315" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">Registrar evento, decisão relatada e consequência visível</text></svg>
