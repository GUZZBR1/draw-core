<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Taxonomia de decisões de identidade</title><desc id="d">Relação conceitual entre anotação externa, decisão e classes de erro avaliadas.</desc><rect width="1200" height="430" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Eventos, decisões e consequências</text><rect x="40" y="105" width="330" height="78" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="205.0" y="149.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Evento observado</text><rect x="425" y="105" width="330" height="78" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="590.0" y="149.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Decisão relatada</text><line x1="374" y1="144.0" x2="421" y2="144.0" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><rect x="810" y="105" width="330" height="78" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="975.0" y="149.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Consequência visível</text><line x1="759" y1="144.0" x2="806" y2="144.0" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><rect x="145" y="250" width="390" height="88" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="340.0" y="294.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Fusão indevida</text><text x="340.0" y="314.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">páginas distintas associadas</text><rect x="665" y="250" width="390" height="88" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="860.0" y="294.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Separação indevida</text><text x="860.0" y="314.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">uma página tratada como nova</text><text x="600" y="390" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#647178" text-anchor="middle">Categorias para análise externa, sem descrever regra de identidade</text></svg>
