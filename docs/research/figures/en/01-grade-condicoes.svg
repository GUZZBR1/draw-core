<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Pose and distance grid</title><desc id="d">Qualitative crossing of angle and distance in still and moving states.</desc><rect width="1200" height="540" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Grid of geometric conditions</text><text x="430.0" y="135" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">smaller angle</text><text x="540.0" y="135" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">medium angle</text><text x="650.0" y="135" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">larger angle</text><text x="365" y="205.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="end">near</text><rect x="375" y="145" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#D8DFDD" stroke-width="2"/><rect x="485" y="145" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#D8DFDD" stroke-width="2"/><rect x="595" y="145" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#D8DFDD" stroke-width="2"/><text x="365" y="315.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="end">intermediate</text><rect x="375" y="255" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#D8DFDD" stroke-width="2"/><rect x="485" y="255" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#D8DFDD" stroke-width="2"/><rect x="595" y="255" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#D8DFDD" stroke-width="2"/><text x="365" y="425.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="end">far</text><rect x="375" y="365" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#D8DFDD" stroke-width="2"/><rect x="485" y="365" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#D8DFDD" stroke-width="2"/><rect x="595" y="365" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#D8DFDD" stroke-width="2"/><rect x="830" y="145" width="250" height="75" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="955.0" y="187.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Still sheet</text><rect x="830" y="265" width="250" height="75" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="955.0" y="307.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Moving sheet</text><text x="600" y="500" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">Each distance and angle combination is observed in both states</text></svg>
