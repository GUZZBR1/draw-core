<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Camera and sheet geometry</title><desc id="d">Camera observing a tilted sheet, with distance and orientation shown conceptually.</desc><rect width="1200" height="430" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Conceptual scene geometry</text><rect x="70" y="170" width="210" height="100" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="175.0" y="220.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Camera</text><text x="175.0" y="240.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">observation point</text><line x1="290" y1="220" x2="700" y2="220" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><polygon points="760,110 1050,145 1015,315 725,280" fill="#FFFFFF" stroke="#7869A6" stroke-width="3"/><text x="870" y="215" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#25333A" text-anchor="middle">Sheet</text><text x="490" y="195" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">capture distance</text><text x="955" y="345" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">angular pose</text><text x="600" y="385" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">Position and orientation are evaluation conditions, not internal details</text></svg>
