<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Catalog of environmental perturbations</title><desc id="d">Eight schematic factors that may vary in a robustness evaluation.</desc><rect width="1200" height="420" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Observable scene perturbations</text><rect x="45" y="115" width="250" height="92" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="170.0" y="161.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Reflection</text><text x="170.0" y="181.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">localized glare</text><rect x="335" y="115" width="250" height="92" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="460.0" y="161.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Shadow</text><text x="460.0" y="181.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">cast shadow</text><rect x="625" y="115" width="250" height="92" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="750.0" y="161.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Blur</text><text x="750.0" y="181.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">loss of sharpness</text><rect x="915" y="115" width="250" height="92" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="1040.0" y="161.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Noise</text><text x="1040.0" y="181.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">visual variation</text><rect x="45" y="265" width="250" height="92" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="170.0" y="311.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Fold / crease</text><text x="170.0" y="331.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">deformed paper</text><rect x="335" y="265" width="250" height="92" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="460.0" y="311.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Background</text><text x="460.0" y="331.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">surrounding surface</text><rect x="625" y="265" width="250" height="92" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="750.0" y="311.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Paper color</text><text x="750.0" y="331.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">different tones</text><rect x="915" y="265" width="250" height="92" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="1040.0" y="311.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Light source</text><text x="1040.0" y="331.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">origin and direction</text></svg>
