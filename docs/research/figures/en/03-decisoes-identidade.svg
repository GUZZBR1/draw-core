<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Taxonomy of identity decisions</title><desc id="d">Conceptual relation between external annotation, decision and evaluated error classes.</desc><rect width="1200" height="430" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Events, decisions and consequences</text><rect x="40" y="105" width="330" height="78" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="205.0" y="149.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Observed event</text><rect x="425" y="105" width="330" height="78" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="590.0" y="149.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Reported decision</text><line x1="374" y1="144.0" x2="421" y2="144.0" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><rect x="810" y="105" width="330" height="78" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="975.0" y="149.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Visible consequence</text><line x1="759" y1="144.0" x2="806" y2="144.0" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><rect x="145" y="250" width="390" height="88" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="340.0" y="294.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Improper merge</text><text x="340.0" y="314.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">distinct pages associated</text><rect x="665" y="250" width="390" height="88" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="860.0" y="294.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Improper split</text><text x="860.0" y="314.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">one page treated as new</text><text x="600" y="390" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#647178" text-anchor="middle">Categories for external analysis, without describing an identity rule</text></svg>
