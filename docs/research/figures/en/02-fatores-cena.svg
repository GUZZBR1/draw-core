<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Conceptual compatibility matrix</title><desc id="d">Empty matrix of file categories and uses, with no declared results.</desc><rect width="1200" height="620" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Scene factors in page evaluation</text><rect x="65" y="105" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="215.0" y="150.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Lighting</text><text x="215.0" y="170.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">uniform or shadowed</text><rect x="450" y="105" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="600.0" y="150.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Occlusion</text><text x="600.0" y="170.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">free or partly covered</text><rect x="835" y="105" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="985.0" y="150.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Framing</text><text x="985.0" y="170.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">centered or near the edge</text><text x="600" y="255" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#647178" text-anchor="middle">Schematic labels; each variation requires an annotated scene</text></svg>
