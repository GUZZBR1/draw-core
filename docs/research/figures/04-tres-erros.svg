<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Erros observáveis de preservação da tinta</title><desc id="d">Traço esquemático deslocado, interrompido ou duplicado em relação a referência.</desc><rect width="1200" height="430" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Três discrepâncias da tinta em uma sequência</text><rect x="55" y="95" width="310" height="210" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="210" y="135" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Deslocado</text><text x="210" y="340" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">posição divergente</text><rect x="445" y="95" width="310" height="210" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="600" y="135" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Fragmentado</text><text x="600" y="340" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">trecho ausente</text><rect x="835" y="95" width="310" height="210" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="990" y="135" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Repetido</text><text x="990" y="340" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">marca duplicada</text><path d="M95 205 L315 205" fill="none" stroke="#647178" stroke-width="4" stroke-dasharray="8 5"/><path d="M95 260 L315 260" fill="none" stroke="#A76C4E" stroke-width="4"/><path d="M485 215 L555 215 M600 215 L685 215" fill="none" stroke="#647178" stroke-width="4" stroke-dasharray="8 5"/><path d="M485 260 L535 260 M625 260 L685 260" fill="none" stroke="#A76C4E" stroke-width="4"/><path d="M875 235 L1095 235" fill="none" stroke="#647178" stroke-width="4" stroke-dasharray="8 5"/><path d="M875 215 L1095 215 M875 265 L1095 265" fill="none" stroke="#A76C4E" stroke-width="3"/><text x="600" y="390" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#647178" text-anchor="middle">Tracejado: referência independente; linha contínua: exemplo observado</text></svg>
